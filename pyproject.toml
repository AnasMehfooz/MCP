[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-store"
version = "0.2.0"
description = "Headless e-commerce backend managed by Claude through MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.5,<1",
    "alembic>=1.20,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29", "stripe>=17,<18"]
dev = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "stripe>=17,<18",
    "pytest>=8",
    "httpx>=0.27",
    "python-dotenv>=1",
    "ruff>=0.17",
    "import-linter>=2.16",
    "pre-commit>=4",
]

[project.scripts]
ai-store = "store.mcp_server:main"

[project.urls]
Repository = "https://github.com/AnasMehfooz/mcp"

[tool.setuptools.packages.find]
include = ["store*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
# An export of the project doc: kept as exported, so ruff does not reformat its code blocks.
extend-exclude = ["docs/BLUEPRINT.md"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",      # pyflakes
    "I",      # import order
    "UP",     # modern syntax for the target Python
    "B",      # likely bugs
    "SIM",    # simplifications
    "C4",     # comprehensions
    "PT",     # pytest style
    "RUF",    # ruff-specific
]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the intended pattern
    "PT018", # compound asserts are fine in short tests
]

[tool.ruff.lint.isort]
known-first-party = ["store", "scripts"]

# Architecture rules, checked by `lint-imports` (pre-commit and CI).
# Domain packages (store.<domain>.models / schemas / services) hold the business rules;
# adapters (store.api, store.mcp_server, later store.agents) stay thin on top of them.
# The wildcards cover every domain package, so a new domain needs no change here.
[tool.importlinter]
root_package = "store"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain code never imports adapters"
type = "forbidden"
source_modules = [
    "store.*.models",
    "store.*.schemas",
    "store.*.services",
    "store.config",
    "store.context",
    "store.db",
    "store.errors",
    "store.metadata",
    "store.money",
    "store.slugs",
]
forbidden_modules = ["store.api", "store.mcp_server"]

[[tool.importlinter.contracts]]
name = "Adapters import services, never models"
type = "forbidden"
source_modules = ["store.api", "store.mcp_server"]
forbidden_modules = ["store.*.models"]
allow_indirect_imports = true # services importing models is fine; adapters doing it directly is not

[[tool.importlinter.contracts]]
name = "Business logic stays framework-free"
type = "forbidden"
source_modules = ["store.*.models", "store.*.schemas", "store.*.services"]
forbidden_modules = ["fastapi", "starlette", "mcp"]
