# Alembic configuration.
#
# There is no database URL here on purpose: migrations/env.py takes it from the app settings
# (STORE_DATABASE_URL in the environment or .env), so Alembic and the app always agree.
#
#   alembic upgrade head                                           apply all migrations
#   alembic revision --autogenerate -m "orders" --rev-id 0002      new migration from model changes
#   alembic upgrade head --sql                                     print the SQL instead of running it
#   alembic check                                                  fail if models and migrations differ
#   alembic downgrade -1                                           undo the latest migration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 0002_orders.py: with sequential --rev-id values the folder lists migrations in order.
file_template = %%(rev)s_%%(slug)s

# New revision files get the same formatting and lint fixes as the rest of the code.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME

# Logging for the alembic command line (env.py applies it there only).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
